- content: "#### 42\n\n### Step-by-step reasoning:\n\n1. Let's denote Xavier's current\
    \ age by \\( X \\) and Yasmin's current age by \\( Y \\).\n\n2. According to the\
    \ problem, Xavier is twice as old as Yasmin:\n   \\[\n   X = 2Y\n   \\]\n\n3.\
    \ It's also given that Xavier will be 30 years old in six years:\n   \\[\n   X\
    \ + 6 = 30\n   \\]\n\n4. We can solve the equation \\( X + 6 = 30 \\) for \\(\
    \ X \\):\n   \\[\n   X = 30 - 6\n   \\]\n   \\[\n   X = 24\n   \\]\n\n5. Using\
    \ the relationship \\( X = 2Y \\), we can find Yasmin's current age:\n   \\[\n\
    \   24 = 2Y\n   \\]\n   \\[\n   Y = \\frac{24}{2}\n   \\]\n   \\[\n   Y = 12\n\
    \   \\]\n\n6. Now we can find the total of their ages now:\n   \\[\n   X + Y =\
    \ 24 + 12\n   \\]\n   \\[\n   X + Y = 36\n   \\]\n\n### Conclusion:\n#### 36\n\
    \nTherefore, the answer is 36."
