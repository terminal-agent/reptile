services:
  client:
    build:
      context: ${LOCOMO_TASK_BUILD_CONTEXT_DIR}
      dockerfile: Dockerfile
    image: ${LOCOMO_TASK_DOCKER_CLIENT_IMAGE_NAME}
    container_name: ${LOCOMO_TASK_DOCKER_CLIENT_CONTAINER_NAME}
    command: [ "sh", "-c", "sleep infinity" ]
    environment:
      - TEST_DIR=${LOCOMO_TEST_DIR}
    volumes:
      - ${LOCOMO_TASK_LOGS_PATH}:${LOCOMO_CONTAINER_LOGS_PATH}
