<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChatGPT‑Style Chat Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#202123;color:#ECECF1;height:100vh;display:flex;justify-content:center;align-items:center}
.container{width:100%;max-width:1200px;background:#343541;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column;height:90vh}
.header{background:#40414F;padding:16px;text-align:center}
.header h1{font-size:1.5rem}
.file-upload{background:#343541;padding:16px;border-bottom:1px solid #444654;text-align:center}
.file-upload input[type="file"]{display:none}
.file-upload label{cursor:pointer;color:#ECECF1;padding:8px 16px;background:#444654;border-radius:4px;transition:background .2s}
.file-upload label:hover{background:#55555f}
.github-url{margin-top:10px;display:flex;justify-content:center;gap:8px}
.github-url input{width:70%;padding:6px;border-radius:4px;border:none}
.github-url button{padding:6px 12px;border:none;border-radius:4px;background:#444654;color:#ECECF1;cursor:pointer}
.github-url button:hover{background:#55555f}
.chat-container{flex:1;overflow-y:auto;padding:16px}
.message{margin:8px 0;padding:12px;border-radius:8px;max-width:70%;word-wrap:break-word;position:relative;max-height:300px;overflow-y:auto}
.message.user{background:#0B93F6;color:#fff;margin-left:auto}
.message.llm{background:#444654;color:#ECECF1;margin-right:auto}
.message.terminal{background:#0F0F0F;color:#33FF33;font-family:'Courier New',monospace;margin-right:auto}
.message-header{font-size:.8rem;opacity:.7;margin-bottom:6px;display:flex;justify-content:space-between}
.code-block{background:#1E1E1E;color:#ECECF1;padding:8px;border-radius:4px;font-family:'Courier New',monospace;overflow-x:auto;margin:8px 0}
.version-navigator{display:flex;gap:4px;margin-top:8px}
.version-button{background:#55555f;color:#ECECF1;border:none;border-radius:4px;padding:2px 6px;font-size:.75rem;cursor:pointer}
.version-button.active{background:#76C7B7}
.edit-highlight{background-color:#5b646f;padding:0 4px;border-left:4px solid #76C7B7;margin-right:4px}
.traj-selector{background:#343541;padding:12px 16px;border-bottom:1px solid #444654;display:flex;align-items:center;gap:10px}
.traj-selector label{font-size:.9rem}
.traj-selector select{padding:6px 12px;border-radius:4px;border:1px solid #444654;background:#40414F;color:#ECECF1;cursor:pointer;font-size:.9rem}
.traj-selector select:hover{background:#4a4b5f}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>💬 ChatGPT Style Interface</h1></div>
  <div class="file-upload">
    <input type="file" id="fileInput" accept=".yaml,.yml,.txt">
    <label for="fileInput">📁 Upload YAML or TXT</label>
    <div class="github-url">
      <input type="text" id="githubUrl" placeholder="Paste GitHub raw file URL">
      <button id="loadGithubBtn">Load</button>
    </div>
  </div>
  <div class="traj-selector" id="trajSelectorContainer" style="display:none;">
    <label for="trajSelect">Select Trajectory:</label>
    <select id="trajSelect">
      <option value="">Latest (Default)</option>
    </select>
  </div>
  <div class="chat-container" id="chatContainer">
    <p style="opacity:.6;text-align:center;margin-top:20px">Upload a file to view conversation…</p>
  </div>
</div>

<script>
class ChatInterface{
  constructor(){
    this.conversationData=[];
    this.versionSelections={};
    this.selectedGlobalTraj=null;
    this.init();
  }

  init(){
    this.setupFileUpload();
    this.setupDragAndDrop();
    this.setupGithubLoader();
    this.setupTrajSelector();
  }

  setupTrajSelector(){
    document.getElementById('trajSelect')
      .addEventListener('change',(e)=>{
        const val=e.target.value;
        if(val===''){
          this.selectedGlobalTraj=null;
          this.versionSelections={};
        }else{
          this.selectedGlobalTraj=parseInt(val);
          this.versionSelections={};
          // Find first step with this traj and set selection
          const grouped=this.groupByStepAndTraj();
          const steps=Object.keys(grouped).map(Number).sort((a,b)=>a-b);
          for(const step of steps){
            if(grouped[step][this.selectedGlobalTraj]){
              this.versionSelections[step]=this.selectedGlobalTraj;
              break;
            }
          }
        }
        this.renderConversation();
      });
  }

  setupFileUpload(){
    document.getElementById('fileInput')
     .addEventListener('change',e=>{
       if(e.target.files[0])this.loadFile(e.target.files[0]);
     });
  }

  setupGithubLoader(){
    document.getElementById('loadGithubBtn')
      .addEventListener('click', async ()=>{
        const url=document.getElementById('githubUrl').value.trim();
        if(!url)return alert("Please paste a GitHub raw file URL.");
        try{
          const res=await fetch(url);
          if(!res.ok)throw new Error("Failed to fetch file.");
          const text=await res.text();
          let data;
          try{data=jsyaml.load(text);}
          catch{data=this.parseText(text);}
          this.processData(data);
        }catch(err){
          alert("Error loading GitHub file: "+err.message);
        }
      });
  }

  setupDragAndDrop(){
    const box=document.querySelector('.file-upload');
    ['dragover','dragleave'].forEach(evt=>{
      box.addEventListener(evt,e=>{
        e.preventDefault();
        box.style.background=evt==='dragover'?'#55555f':'#343541';
      });
    });
    box.addEventListener('drop',e=>{
      e.preventDefault();box.style.background='#343541';
      if(e.dataTransfer.files[0])this.loadFile(e.dataTransfer.files[0]);
    });
  }

  loadFile(file){
    const reader=new FileReader();
    reader.onload=e=>{
      let data;
      try{data=jsyaml.load(e.target.result);}
      catch{data=this.parseText(e.target.result);}
      this.processData(data);
    };
    reader.readAsText(file);
  }

  parseText(content){
    const lines=content.split('\n'),msgs=[];let msg=null;
    lines.forEach(line=>{
      const t=line.trim();
      if(t.startsWith('- content:')){
        if(msg)msgs.push(msg);
        msg={content:t.slice(10).trim(),role:'',step:0,traj:0,name:''};
      }else if(/role:/.test(t))msg.role=t.split(':')[1].trim();
      else if(/name:/.test(t))msg.name=t.split(':')[1].trim();
      else if(/step:/.test(t))msg.step=parseInt(t.split(':')[1]);
      else if(/traj:/.test(t))msg.traj=parseInt(t.split(':')[1]);
      else if(t&&!t.startsWith('-')&&msg)msg.content+='\n'+t;
    });
    if(msg)msgs.push(msg);
    return msgs;
  }

  processData(data){
    this.conversationData=Array.isArray(data)?data:[data];
    this.versionSelections={};
    this.selectedGlobalTraj=null;
    this.populateTrajSelector();
    this.renderConversation();
  }

  populateTrajSelector(){
    const grouped=this.groupByStepAndTraj();
    const allTrajs=new Set();
    Object.values(grouped).forEach(stepData=>{
      Object.keys(stepData).forEach(traj=>allTrajs.add(parseInt(traj)));
    });

    const trajArray=Array.from(allTrajs).sort((a,b)=>a-b);
    const select=document.getElementById('trajSelect');
    select.innerHTML='<option value="">Latest (Default)</option>';

    trajArray.forEach(traj=>{
      const option=document.createElement('option');
      option.value=traj;
      option.textContent=`Trajectory ${traj}`;
      select.appendChild(option);
    });

    document.getElementById('trajSelectorContainer').style.display=
      trajArray.length>1?'flex':'none';
  }

  groupByStepAndTraj(){
    return this.conversationData.reduce((acc,m)=>{
      const s=parseInt(m.step)||0, t=parseInt(m.traj)||0;
      acc[s]=acc[s]||{}; acc[s][t]=acc[s][t]||[];
      acc[s][t].push(m);
      return acc;
    },{});
  }

  renderConversation(){
    const container=document.getElementById('chatContainer');
    container.innerHTML='';
    const grouped=this.groupByStepAndTraj();
    const steps=Object.keys(grouped).map(Number).sort((a,b)=>a-b);

    // Find the earliest explicit selection
    let earliestSelection=null;
    let selectedTraj=null;
    for(const step of steps){
      if(this.versionSelections.hasOwnProperty(step)){
        earliestSelection=step;
        selectedTraj=this.versionSelections[step];
        break;
      }
    }

    // Find max step for selected trajectory
    let maxStepForSelectedTraj=Infinity;
    if(earliestSelection!==null){
      maxStepForSelectedTraj=Math.max(...steps.filter(s=>
        grouped[s] && grouped[s][selectedTraj]
      ));
    }

    steps.forEach(step=>{
      // Skip steps beyond max step of selected trajectory
      if(earliestSelection!==null && step>maxStepForSelectedTraj){
        return;
      }

      const trajs=Object.keys(grouped[step]).map(Number).sort((a,b)=>a-b);
      const lastTraj=trajs[trajs.length-1];
      let chosenTraj;

      if(earliestSelection===null){
        // No explicit selection, use latest traj
        chosenTraj=lastTraj;
      }else if(step<earliestSelection){
        // Before selection: use largest traj <= selectedTraj
        chosenTraj=trajs.filter(t=>t<=selectedTraj).pop()||trajs[0];
      }else if(step===earliestSelection){
        // At selection point: use selected traj
        chosenTraj=selectedTraj;
      }else{
        // After selection: use selectedTraj if exists, otherwise stop
        if(trajs.includes(selectedTraj)){
          chosenTraj=selectedTraj;
        }else{
          return; // Stop rendering, selected traj doesn't exist at this step
        }
      }

      // Check if chosen traj exists at this step
      if(!grouped[step][chosenTraj])return;

      this.renderMessageWithNavigator(
        grouped[step][chosenTraj][0],
        trajs,
        chosenTraj,
        lastTraj,
        step,
        container,
        grouped[step]
      );
    });
  }

  renderMessageWithNavigator(msg,trajs,chosenTraj,lastTraj,step,container,stepData){
    const el=this.createMessageElement(msg);
    if(trajs.length>1){
      const nav=document.createElement('div');
      nav.className='version-navigator';
      trajs.forEach((tr,index)=>{
        const btn=document.createElement('button');
        btn.className='version-button';
        btn.textContent=`T${tr} (v${index+1})`;
        if(tr===chosenTraj)btn.classList.add('active');
        btn.style.cursor='pointer';
        btn.type='button';

        btn.addEventListener('click',(e)=>{
          e.preventDefault();
          e.stopPropagation();
          // Clear all selections and set only this one
          this.versionSelections={};
          this.versionSelections[step]=tr;
          this.renderConversation();
          // Scroll to this message after re-render
          setTimeout(()=>{
            const messages=container.querySelectorAll('.message');
            const stepIndex=Array.from(messages).findIndex(m=>
              m.querySelector('.message-header')?.textContent.includes(`Step ${step}`)
            );
            if(stepIndex>=0)messages[stepIndex].scrollIntoView({behavior:'smooth',block:'center'});
          },50);
        });
        nav.appendChild(btn);
      });
      el.appendChild(nav);
    }
    container.appendChild(el);
  }

  createMessageElement(msg){
    const displayRole=msg.name||msg.role||'llm';
    const el=document.createElement('div');
    el.className=`message ${displayRole}`;

    const header=document.createElement('div');
    header.className='message-header';
    header.innerHTML=`<span>${this.icon(displayRole)} ${this.label(displayRole)}</span>
                      <span>Step ${msg.step || 0}, T${msg.traj || 0}</span>`;

    const contentWrap=document.createElement('div');
    contentWrap.className='message-content';

    const body=document.createElement('div');
    body.style.whiteSpace='pre-wrap';

    let contentStr=String(msg.content||'');
    if(msg.edit_prefix){
      const escapedPrefix=msg.edit_prefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const regex=new RegExp(`^(${escapedPrefix})`);
      contentStr=contentStr.replace(regex,`<span class="edit-highlight">$1</span>`);
      body.innerHTML=contentStr;
    }else{
      body.textContent=contentStr.replace(/^['\"]|['\"]$/g,'');
    }

    contentWrap.appendChild(body);
    el.append(header,contentWrap);
    return el;
  }

  icon(role){return {user:'👤',llm:'🤖',terminal:'💻'}[role]||'📝';}
  label(role){return {user:'User',llm:'Assistant',terminal:'Terminal'}[role]||role;}
}

window.addEventListener('DOMContentLoaded',()=>window.chatApp=new ChatInterface());
</script>
</body>
</html>
